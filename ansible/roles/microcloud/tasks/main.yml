- name: Add cluster members to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} MicroCloud cluster members"
    block: |
      {% for host in groups['microcloud'] %}
      {{ hostvars[host].ansible_host }} {{ host }}.{{ node_domain }} {{ host }}
      {% endfor %}

- name: Install MicroCloud snaps
  ansible.builtin.command:
    cmd: "snap install {{ item.name }} --channel={{ item.channel }} --cohort=+"
    creates: "/snap/bin/{{ item.name }}"
  loop: "{{ microcloud_snaps }}"
  loop_control:
    label: "{{ item.name }} ({{ item.channel }})"

- name: List installed MicroCloud snaps
  ansible.builtin.command:
    cmd: "snap list {{ microcloud_snaps | map(attribute='name') | join(' ') }}"
  register: microcloud_snap_list
  changed_when: false

- name: Find snaps that are not held yet
  ansible.builtin.set_fact:
    microcloud_unheld_snaps: >-
      {{ microcloud_snap_list.stdout_lines[1:]
         | reject('search', 'held')
         | map('split')
         | map('first')
         | list }}

- name: Hold automatic refreshes of MicroCloud snaps
  ansible.builtin.command:
    cmd: "snap refresh --hold {{ microcloud_unheld_snaps | join(' ') }}"
  when: microcloud_unheld_snaps | length > 0

- name: Render MicroCloud preseed file
  ansible.builtin.template:
    src: preseed.yaml.j2
    dest: "{{ microcloud_preseed_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Wait for the MicroCloud daemon
  ansible.builtin.command: microcloud waitready --timeout 120
  changed_when: false

- name: Check whether this node is already a MicroCloud member
  ansible.builtin.command: microcloud cluster list
  register: microcloud_membership
  changed_when: false
  failed_when: false

# All nodes must run the same preseed at the same time; Ansible runs this task on every
# host in parallel, and async keeps the long-running command from hitting SSH timeouts.
- name: Initialise MicroCloud from preseed
  ansible.builtin.shell: "microcloud preseed < {{ microcloud_preseed_path }}"
  async: 1800
  poll: 15
  when: microcloud_membership.rc != 0

- name: Read MicroCloud status
  ansible.builtin.command: microcloud status
  register: microcloud_status
  changed_when: false
  run_once: true

- name: Show MicroCloud status
  ansible.builtin.debug:
    var: microcloud_status.stdout_lines
  run_once: true
