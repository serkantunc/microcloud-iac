# Keep all nodes on the same package versions: Ubuntu phases out some updates to a
# percentage of machines (by machine-id), which leaves cluster members out of sync.
- name: Include phased updates in apt upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-include-phased-updates
    content: |
      APT::Get::Always-Include-Phased-Updates "true";
    owner: root
    group: root
    mode: "0644"
  when: apt_include_phased_updates

- name: Remove phased updates override
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/99-include-phased-updates
    state: absent
  when: not apt_include_phased_updates

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot if required
  ansible.builtin.reboot:
  when: reboot_required.stat.exists

- name: Read snapd version
  ansible.builtin.command: snap version
  register: snap_version_output
  changed_when: false

- name: Extract snapd version
  ansible.builtin.set_fact:
    snapd_version: >-
      {{ snap_version_output.stdout
         | regex_search('^snapd\s+([0-9.]+)', '\1', multiline=True)
         | first }}

- name: Ensure snapd is recent enough for MicroCloud 3.4 (core26 base)
  ansible.builtin.assert:
    that:
      - snapd_version is version(snapd_min_version, '>=')
    fail_msg: "snapd {{ snapd_version }} is older than the required {{ snapd_min_version }}"
    success_msg: "snapd {{ snapd_version }} meets the minimum of {{ snapd_min_version }}"

# Workaround for https://bugs.launchpad.net/snapd/+bug/2104066 (snap installs can fail
# while snapd enters standby on a system with no snaps). Fixed in snapd 2.69, so this
# only applies to older snapd versions.
- name: Create snapd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/snapd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: snapd_version is version(snapd_standby_fix_version, '<')

- name: Configure snapd standby wait
  ansible.builtin.copy:
    dest: /etc/systemd/system/snapd.service.d/override.conf
    content: |
      [Service]
      Environment=SNAPD_STANDBY_WAIT=1m
    owner: root
    group: root
    mode: "0644"
  when: snapd_version is version(snapd_standby_fix_version, '<')
  notify: Restart snapd
