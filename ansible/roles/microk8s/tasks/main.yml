---
- name: Install MicroK8s
  ansible.builtin.command:
    cmd: "snap install microk8s --classic --channel={{ microk8s_channel }}"
    creates: /snap/bin/microk8s

- name: Hold automatic refreshes of MicroK8s
  ansible.builtin.command: snap refresh --hold microk8s
  changed_when: false

- name: Add the admin user to the microk8s group
  ansible.builtin.user:
    name: "{{ microk8s_user }}"
    groups: microk8s
    append: true

- name: Wait for MicroK8s
  ansible.builtin.command: microk8s status --wait-ready --timeout 300
  changed_when: false

- name: Read enabled addons
  ansible.builtin.command: microk8s status --format yaml
  register: microk8s_status
  changed_when: false

- name: Compute enabled addons
  ansible.builtin.set_fact:
    microk8s_enabled_addons: >-
      {{ (microk8s_status.stdout | from_yaml).addons
         | selectattr('status', 'equalto', 'enabled')
         | map(attribute='name')
         | list }}

- name: Enable addons
  ansible.builtin.command: "microk8s enable {{ item }}"
  loop: "{{ microk8s_addons | difference(microk8s_enabled_addons) }}"
  changed_when: true

- name: Enable MetalLB on the LAN range
  ansible.builtin.command: "microk8s enable metallb:{{ microk8s_metallb_range }}"
  when: "'metallb' not in microk8s_enabled_addons"
  changed_when: true

- name: Wait for MicroK8s after addon changes
  ansible.builtin.command: microk8s status --wait-ready --timeout 300
  changed_when: false
